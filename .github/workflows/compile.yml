name: Compilar LaTeX

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compilar todas las unidades
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            unit1/unit1.tex
            unit2/unit2.tex
            unit3/unit3.tex
          work_in_root_file_dir: true

      - name: Confirmar PDFs en el repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add unit*/unit*.pdf
          git diff --cached --quiet || git commit -m "docs: actualizar PDFs compilados [skip ci]"
          git push
